services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Loopback only. A bare "3001:3001" publishes on every host interface, and
    # Docker writes its own iptables rules, so it bypasses firewalld entirely.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - BACKUP_DISK=/backup
      - SCRIPTS_DIR=/scripts
      - PORT=3001
      # Inside the container the API must listen on all interfaces so the web
      # container can reach it; exposure to the host is limited by `ports` above.
      - HOST=0.0.0.0
      # The Vite proxy rewrites Host to the service name (changeOrigin).
      - ALLOWED_HOSTS=api
    volumes:
      - /run/media/amitp/Backup:/backup:ro
      - ./scripts:/scripts:ro
    restart: unless-stopped
    networks:
      - snapshot-net
    security_opt:
      - label=disable

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DOCKER=true
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - snapshot-net
    security_opt:
      - label=disable

networks:
  snapshot-net:
    driver: bridge
